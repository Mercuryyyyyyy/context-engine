<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0969DA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#FF4D4F"/>
    </marker>
    <marker id="arrG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#8C9BB3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="800" fill="#FFFFFF"/>

  <text x="800" y="48" text-anchor="middle" font-size="26" font-weight="600" fill="#101623">Context Engine 系统架构</text>
  <text x="800" y="74" text-anchor="middle" font-size="13" fill="#5B6B84">AI 编程场景的 LLM 上下文管理代理 · 输入侧拦截改写 · 输出原样透传</text>

  <!-- ===== 主链路两端 ===== -->
  <rect x="40" y="120" width="200" height="96" rx="12" fill="#F5F8FC" stroke="#D6DFEA"/>
  <text x="140" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#101623">客户端 Client</text>
  <text x="140" y="180" text-anchor="middle" font-size="10.5" fill="#5B6B84">AI 编程工具 / IDE</text>
  <text x="140" y="197" text-anchor="middle" font-size="10.5" fill="#5B6B84">自写脚本</text>

  <rect x="1360" y="120" width="200" height="96" rx="12" fill="#F5F8FC" stroke="#D6DFEA"/>
  <text x="1460" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#101623">上游 LLM API</text>
  <text x="1460" y="173" text-anchor="middle" font-size="10" fill="#5B6B84">OpenAI / Anthropic</text>
  <text x="1460" y="190" text-anchor="middle" font-size="10" fill="#5B6B84">DeepSeek（评测）</text>

  <!-- 请求 / 响应箭头：左 -->
  <line x1="244" y1="148" x2="286" y2="148" stroke="#0969DA" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="265" y="136" text-anchor="middle" font-size="10" fill="#5B6B84">messages</text>
  <line x1="286" y1="188" x2="244" y2="188" stroke="#FF4D4F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="265" y="206" text-anchor="middle" font-size="10" fill="#5B6B84">透传</text>

  <!-- 请求 / 响应箭头：右 -->
  <line x1="1304" y1="148" x2="1356" y2="148" stroke="#0969DA" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="1330" y="136" text-anchor="middle" font-size="10" fill="#5B6B84">改写后</text>
  <line x1="1356" y1="188" x2="1304" y2="188" stroke="#FF4D4F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="1330" y="206" text-anchor="middle" font-size="10" fill="#5B6B84">透传</text>

  <!-- ===== Proxy 大区 ===== -->
  <rect x="290" y="110" width="1010" height="390" rx="12" fill="#EEF5FE" stroke="#0969DA"/>
  <text x="306" y="140" font-size="15" font-weight="600" fill="#09396B">context-proxy · 拦截点</text>
  <text x="306" y="162" font-size="11" fill="#2B3A55">Hono HTTP 代理：双协议路由 → 调 engine 改写 messages → 转发上游</text>
  <line x1="306" y1="174" x2="1284" y2="174" stroke="#D6DFEA"/>
  <text x="306" y="196" font-size="12" font-weight="600" fill="#101623">context-engine 核心库 · 五步管线（输入侧单向）</text>

  <!-- 步骤 1 -->
  <rect x="306" y="210" width="182" height="176" rx="8" fill="#FFFFFF" stroke="#D6DFEA"/>
  <text x="322" y="238" font-size="12.5" font-weight="600" fill="#101623">① 分层</text>
  <text x="322" y="264" font-size="10.5" fill="#2B3A55">按稳定度切 5 层</text>
  <text x="322" y="282" font-size="10.5" fill="#2B3A55">system / tools / rules</text>
  <text x="322" y="300" font-size="10.5" fill="#2B3A55">/ history / dynamic</text>
  <line x1="322" y1="318" x2="472" y2="318" stroke="#EEF2F7"/>
  <text x="322" y="340" font-size="9.5" fill="#5B6B84">决定缓存与压缩优先级</text>

  <line x1="490" y1="298" x2="502" y2="298" stroke="#8C9BB3" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 步骤 2 -->
  <rect x="504" y="210" width="182" height="176" rx="8" fill="#FFFFFF" stroke="#0969DA"/>
  <text x="520" y="238" font-size="12.5" font-weight="600" fill="#101623">② 归档</text>
  <text x="520" y="264" font-size="10.5" fill="#2B3A55">ModuleTracker 检测</text>
  <text x="520" y="282" font-size="10.5" fill="#2B3A55">主题切换，旧模块</text>
  <text x="520" y="300" font-size="10.5" fill="#2B3A55">完整内容写入归档库</text>
  <line x1="520" y1="318" x2="670" y2="318" stroke="#EEF2F7"/>
  <text x="520" y="340" font-size="9.5" fill="#5B6B84">仅超水位才归档（护前缀）</text>

  <line x1="688" y1="298" x2="700" y2="298" stroke="#8C9BB3" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 步骤 3 -->
  <rect x="702" y="210" width="182" height="176" rx="8" fill="#FFFFFF" stroke="#0969DA"/>
  <text x="718" y="238" font-size="12.5" font-weight="600" fill="#101623">③ 检索注入</text>
  <text x="718" y="264" font-size="10.5" fill="#2B3A55">按需从归档库召回</text>
  <text x="718" y="282" font-size="10.5" fill="#2B3A55">关键词 / 向量 / RRF</text>
  <text x="718" y="300" font-size="10.5" fill="#2B3A55">混合检索，按 token 截断</text>
  <line x1="718" y1="318" x2="868" y2="318" stroke="#EEF2F7"/>
  <text x="718" y="340" font-size="9.5" fill="#5B6B84">未超预算不注入（护前缀）</text>

  <line x1="886" y1="298" x2="898" y2="298" stroke="#8C9BB3" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 步骤 4 -->
  <rect x="900" y="210" width="182" height="176" rx="8" fill="#FFFFFF" stroke="#0969DA"/>
  <text x="916" y="238" font-size="12.5" font-weight="600" fill="#101623">④ 压缩瀑布</text>
  <text x="916" y="264" font-size="10.5" fill="#2B3A55">无损归一化 → LLM 摘要</text>
  <text x="916" y="282" font-size="10.5" fill="#2B3A55">→ 相关性感知 Middle 清空</text>
  <text x="916" y="300" font-size="10.5" fill="#2B3A55">（保留 hint 关键词）</text>
  <line x1="916" y1="318" x2="1066" y2="318" stroke="#EEF2F7"/>
  <text x="916" y="340" font-size="9.5" fill="#5B6B84">逐级触发，够用即停</text>

  <line x1="1084" y1="298" x2="1096" y2="298" stroke="#8C9BB3" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 步骤 5 -->
  <rect x="1098" y="210" width="182" height="176" rx="8" fill="#FFFFFF" stroke="#D6DFEA"/>
  <text x="1114" y="238" font-size="12.5" font-weight="600" fill="#101623">⑤ 缓存优化</text>
  <text x="1114" y="264" font-size="10.5" fill="#2B3A55">Epoch 锁稳定前缀</text>
  <text x="1114" y="282" font-size="10.5" fill="#2B3A55">+ cache_control 断点</text>
  <text x="1114" y="300" font-size="10.5" fill="#2B3A55">+ token 级命中预估</text>
  <line x1="1114" y1="318" x2="1264" y2="318" stroke="#EEF2F7"/>
  <text x="1114" y="340" font-size="9.5" fill="#5B6B84">裁剪保位置、不移动</text>

  <!-- 机制条 / 结果条 -->
  <rect x="306" y="398" width="978" height="34" rx="8" fill="#F5F8FC" stroke="#D6DFEA"/>
  <text x="320" y="419" font-size="10.5" fill="#2B3A55">Compaction Hysteresis：高水位触发 → 压缩至低水位（0.7×）｜ Epoch 稳定前缀逐字保护，硬上限 1.5× 才全量重压缩</text>

  <rect x="306" y="440" width="978" height="34" rx="8" fill="#FFFFFF" stroke="#52C41A"/>
  <text x="320" y="461" font-size="10.5" fill="#2B3A55">20 轮受控回放：累计输入 −40.3%（234031→139765）｜ 末轮 −58.7% ｜ 相似度 85.6 ｜ 需求覆盖 0.0pp ｜ 非劣率 90% ｜ 退化 0/10 ｜ 缓存 直连79.3%/代理67.7%</text>

  <!-- ===== 旁路连接线 ===== -->
  <line x1="530" y1="500" x2="530" y2="545" stroke="#5B6B84" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="542" y="526" font-size="10" fill="#5B6B84">归档写入 / 检索召回</text>

  <line x1="1060" y1="500" x2="1060" y2="545" stroke="#5B6B84" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1072" y="526" font-size="10" fill="#5B6B84">暴露检索工具</text>

  <!-- ===== 旁路组件 ===== -->
  <rect x="290" y="545" width="480" height="140" rx="10" fill="#FFFFFF" stroke="#5B6B84" stroke-dasharray="6 4"/>
  <text x="306" y="575" font-size="13" font-weight="600" fill="#101623">ArchiveStore（旁路）</text>
  <text x="306" y="599" font-size="10.5" fill="#5B6B84">被压掉的完整消息 + 关键词 / 向量索引</text>
  <text x="306" y="618" font-size="10.5" fill="#5B6B84">BM25 / 向量 / RRF 混合检索 · 按需找回</text>
  <text x="306" y="637" font-size="10.5" fill="#5B6B84">不进持久前缀，仅按需注入</text>

  <rect x="820" y="545" width="480" height="140" rx="10" fill="#FFFFFF" stroke="#5B6B84" stroke-dasharray="6 4"/>
  <text x="836" y="575" font-size="13" font-weight="600" fill="#101623">context-mcp（旁路）</text>
  <text x="836" y="599" font-size="10.5" fill="#5B6B84">独立 stdio MCP server（@modelcontextprotocol/sdk）</text>
  <text x="836" y="618" font-size="10.5" fill="#5B6B84">暴露 search_archive 工具给 MCP 生态</text>
  <text x="836" y="637" font-size="10.5" fill="#5B6B84">只提供工具 · 不改 messages · 不接代理实时 session</text>

  <!-- ===== 图例 ===== -->
  <line x1="40" y1="760" x2="76" y2="760" stroke="#0969DA" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="84" y="764" font-size="11" fill="#5B6B84">请求侧：拦截并改写 messages（输入）</text>

  <line x1="430" y1="760" x2="466" y2="760" stroke="#FF4D4F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="474" y="764" font-size="11" fill="#5B6B84">响应侧：原样透传（不改输出）</text>

  <rect x="760" y="752" width="32" height="16" rx="4" fill="#FFFFFF" stroke="#5B6B84" stroke-dasharray="4 3"/>
  <text x="800" y="764" font-size="11" fill="#5B6B84">旁路组件：不参与请求链路</text>
</svg>
