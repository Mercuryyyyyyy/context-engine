<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 630" width="1240" height="630" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0969DA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#FF4D4F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  <text x="620" y="44" text-anchor="middle" font-size="24" font-weight="600" fill="#101623">Context Engine 系统架构</text>
  <text x="620" y="66" text-anchor="middle" font-size="12" fill="#5B6B84">HTTP 代理层拦截输入侧 · 检索 + 压缩 + 缓存联合优化</text>

  <!-- Client -->
  <rect x="40" y="90" width="170" height="96" rx="12" fill="#F5F8FC" stroke="#D6DFEA"/>
  <text x="125" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#101623">客户端 Client</text>
  <text x="125" y="150" text-anchor="middle" font-size="10.5" fill="#5B6B84">开源 / 自写脚本 / IDE</text>

  <!-- LLM -->
  <rect x="1030" y="90" width="170" height="96" rx="12" fill="#F5F8FC" stroke="#D6DFEA"/>
  <text x="1115" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#101623">上游 LLM API</text>
  <text x="1115" y="142" text-anchor="middle" font-size="10" fill="#5B6B84">OpenAI / Anthropic</text>
  <text x="1115" y="158" text-anchor="middle" font-size="10" fill="#5B6B84">DeepSeek</text>

  <!-- Request arrow 1 -->
  <line x1="214" y1="120" x2="322" y2="120" stroke="#0969DA" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="268" y="104" text-anchor="middle" font-size="10.5" fill="#5B6B84">请求 messages</text>
  <text x="268" y="136" text-anchor="middle" font-size="10.5" fill="#0969DA">输入 · 被拦截</text>
  <!-- Response arrow 1 -->
  <line x1="322" y1="158" x2="214" y2="158" stroke="#FF4D4F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="268" y="176" text-anchor="middle" font-size="10.5" fill="#5B6B84">响应 · 原样透传</text>

  <!-- Request arrow 2 -->
  <line x1="914" y1="120" x2="1026" y2="120" stroke="#0969DA" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="970" y="104" text-anchor="middle" font-size="10.5" fill="#5B6B84">改写后 messages</text>
  <text x="970" y="136" text-anchor="middle" font-size="10.5" fill="#0969DA">转发上游</text>
  <!-- Response arrow 2 -->
  <line x1="1026" y1="158" x2="914" y2="158" stroke="#FF4D4F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="970" y="176" text-anchor="middle" font-size="10.5" fill="#5B6B84">响应透传</text>

  <!-- Proxy -->
  <rect x="330" y="90" width="580" height="300" rx="12" fill="#EEF5FE" stroke="#0969DA"/>
  <text x="344" y="118" font-size="15" font-weight="600" fill="#09396B">context-proxy · 拦截点</text>
  <text x="344" y="138" font-size="11" fill="#2B3A55">Hono HTTP 代理：取请求体 → 调 engine 改写 messages → 转发上游</text>
  <line x1="344" y1="150" x2="896" y2="150" stroke="#D6DFEA"/>
  <text x="344" y="172" font-size="12" font-weight="600" fill="#101623">context-engine 内部管道（输入侧单向）</text>

  <!-- Pipeline steps -->
  <g font-size="10.5" fill="#2B3A55">
    <rect x="344" y="184" width="104" height="76" rx="8" fill="#FFFFFF" stroke="#D6DFEA"/>
    <text x="354" y="208" font-size="12" font-weight="600" fill="#101623">① 分层</text>
    <text x="354" y="228">5 级 tier 标注</text>
    <text x="354" y="243">system→dynamic</text>

    <rect x="456" y="184" width="104" height="76" rx="8" fill="#FFFFFF" stroke="#0969DA"/>
    <text x="466" y="208" font-size="12" font-weight="600" fill="#101623">② 归档</text>
    <text x="466" y="228">主题切换检测</text>
    <text x="466" y="243">完整内容入库</text>

    <rect x="568" y="184" width="104" height="76" rx="8" fill="#FFFFFF" stroke="#0969DA"/>
    <text x="578" y="208" font-size="12" font-weight="600" fill="#101623">③ 检索注入</text>
    <text x="578" y="228">超预算才注入</text>
    <text x="578" y="243">不进持久前缀</text>

    <rect x="680" y="184" width="104" height="76" rx="8" fill="#FFFFFF" stroke="#0969DA"/>
    <text x="690" y="208" font-size="12" font-weight="600" fill="#101623">④ 压缩瀑布</text>
    <text x="690" y="228">可逆→摘要</text>
    <text x="690" y="243">→清中段→drop</text>

    <rect x="792" y="184" width="104" height="76" rx="8" fill="#FFFFFF" stroke="#D6DFEA"/>
    <text x="802" y="208" font-size="12" font-weight="600" fill="#101623">⑤ 缓存优化</text>
    <text x="802" y="228">Epoch 锁前缀</text>
    <text x="802" y="243">+ 断点 + 预估</text>
  </g>

  <!-- Strips inside proxy -->
  <rect x="344" y="272" width="552" height="34" rx="8" fill="#F5F8FC" stroke="#D6DFEA"/>
  <text x="356" y="293" font-size="11" fill="#2B3A55">缓存友好：Compaction Epoch 锁前缀 · 清空式裁剪保骨架 · token 级命中预估</text>
  <rect x="344" y="314" width="552" height="34" rx="8" fill="#FFFFFF" stroke="#52C41A"/>
  <text x="356" y="335" font-size="11" fill="#2B3A55">实测：token −46~63% · 缓存命中 20.8%→53.9% · 相似度 87.8% · 退化 0/18</text>

  <!-- Side stores -->
  <line x1="470" y1="390" x2="470" y2="426" stroke="#5B6B84" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="482" y="408" font-size="10" fill="#5B6B84">归档写入 / 检索召回</text>
  <rect x="330" y="430" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#5B6B84" stroke-dasharray="6 4"/>
  <text x="346" y="456" font-size="13" font-weight="600" fill="#101623">ArchiveStore（旁路）</text>
  <text x="346" y="476" font-size="10.5" fill="#5B6B84">被压掉的完整消息 + BM25 / 向量索引</text>
  <text x="346" y="492" font-size="10.5" fill="#5B6B84">RRF 融合检索 · 按需找回</text>

  <line x1="770" y1="390" x2="770" y2="426" stroke="#5B6B84" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="782" y="408" font-size="10" fill="#5B6B84">暴露检索工具</text>
  <rect x="630" y="430" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#5B6B84" stroke-dasharray="6 4"/>
  <text x="646" y="456" font-size="13" font-weight="600" fill="#101623">context-mcp（旁路）</text>
  <text x="646" y="476" font-size="10.5" fill="#5B6B84">把检索能力暴露给 MCP 生态</text>
  <text x="646" y="492" font-size="10.5" fill="#5B6B84">只提供工具 · 不改 messages</text>

  <!-- Legend -->
  <line x1="40" y1="586" x2="76" y2="586" stroke="#0969DA" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="84" y="590" font-size="11" fill="#5B6B84">请求侧：拦截并改写 messages（输入）</text>
  <line x1="430" y1="586" x2="466" y2="586" stroke="#FF4D4F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="474" y="590" font-size="11" fill="#5B6B84">响应侧：原样透传（不改输出）</text>
  <rect x="740" y="578" width="32" height="16" rx="4" fill="#FFFFFF" stroke="#5B6B84" stroke-dasharray="4 3"/>
  <text x="780" y="590" font-size="11" fill="#5B6B84">旁路组件：不参与请求链路</text>
</svg>
